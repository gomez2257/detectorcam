<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DetectorCam" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>DetectorCam</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=github-estable-01" />
  </head>
  <body>
    <main class="app">
      <section class="camera-shell" aria-label="Camara con inteligencia visual">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="top-bar">
          <div>
            <p class="eyebrow">DetectorCam AI</p>
            <h1>Vision en vivo</h1>
            <p id="motionStats" class="stats">IA cargando...</p>
          </div>
          <div id="status" class="status idle">Lista</div>
        </div>
        <div class="motion-banner" id="motionBanner">Forma detectada</div>
      </section>

      <section class="controls" aria-label="Controles">
        <button id="startCamera" class="primary">Abrir camara</button>
        <button id="record" disabled>Grabar</button>
        <button id="switchCamera" disabled>Cambiar camara</button>

        <label class="field field-full">
          <span>Elegir camara</span>
          <select id="cameraSelect" disabled>
            <option value="">Camara automatica</option>
          </select>
        </label>

        <label class="field field-full">
          <span>Modo IA</span>
          <select id="aiMode">
            <option value="holistic" selected>Cuerpo + manos + cara</option>
            <option value="poseHands">Cuerpo + manos</option>
            <option value="pose">Solo cuerpo</option>
            <option value="motion">Solo movimiento fino</option>
          </select>
        </label>

        <label class="field field-full">
          <span>Vista</span>
          <select id="visualMode">
            <option value="skeleton" selected>Esqueleto</option>
            <option value="points">Solo puntos</option>
            <option value="trail">Rastro sensible</option>
            <option value="heat">Mapa de movimiento</option>
          </select>
        </label>

        <label class="range">
          <span>Sensibilidad</span>
          <input id="sensitivity" type="range" min="8" max="70" value="24" />
        </label>

        <label class="range">
          <span>Detalle</span>
          <input id="detail" type="range" min="3" max="20" value="9" />
        </label>

        <label class="toggle">
          <input id="drawOverlay" type="checkbox" checked />
          <span>Mostrar marcas</span>
        </label>

        <label class="toggle">
          <input id="motionGate" type="checkbox" checked />
          <span>Diferenciar quieto/movimiento</span>
        </label>

        <label class="toggle">
          <input id="globalFilter" type="checkbox" checked />
          <span>Ignorar movimiento general</span>
        </label>

        <label class="toggle">
          <input id="enhanceView" type="checkbox" />
          <span>Mejorar contraste</span>
        </label>
      </section>


      <section class="diagnostics" aria-label="Diagnostico">
        <div class="section-title">
          <h2>Diagnostico</h2>
        </div>
        <div class="diagnostic-grid">
          <div class="diagnostic-item">
            <span>IA</span>
            <strong id="diagAi">Cargando</strong>
          </div>
          <div class="diagnostic-item">
            <span>Camara</span>
            <strong id="diagCamera">Inactiva</strong>
          </div>
          <div class="diagnostic-item">
            <span>Grabador</span>
            <strong id="diagRecorder">Listo</strong>
          </div>
          <div class="diagnostic-item">
            <span>Historial</span>
            <strong id="diagStorage">0 videos</strong>
          </div>
          <div class="diagnostic-item">
            <span>Evento</span>
            <strong id="diagEvent">Sin evento</strong>
          </div>
        </div>
      </section>

      <section class="recordings" aria-label="Grabaciones">
        <div class="section-title">
          <h2>Grabaciones</h2>
          <button id="clearList" class="ghost">Limpiar</button>
        </div>
        <div id="recordingList" class="recording-list">
          <p class="empty">Cuando termines una grabacion aparecera aqui.</p>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js?v=github-estable-01"></script>
  </body>
</html>
